<!doctype html>
<meta charset="utf-8" />
<title>Cedar Lane Auto Detailing</title>
<style>
	body {
		font: 16px system-ui;
		max-width: 560px;
		margin: 2rem auto;
		padding: 0 1rem;
	}
	#log div {
		margin: 0.5rem 0;
		white-space: pre-wrap;
	}
	.you {
		color: #06c;
	}
	form {
		display: flex;
		gap: 0.5rem;
		margin-top: 1rem;
	}
	input {
		flex: 1;
		padding: 0.5rem;
	}
</style>
<h3>Cedar Lane Auto Detailing</h3>
<div id="log"></div>
<form>
	<input
		id="m"
		autofocus
		autocomplete="off"
		placeholder="Type a message"
	/><button>Send</button>
</form>
<script>
	const id = crypto.randomUUID(),
		log = document.getElementById('log'),
		box = document.getElementById('m');
	const add = (cls, who, text) => {
		const d = document.createElement('div');
		d.className = cls;
		d.textContent = who + ': ' + text;
		log.append(d);
		d.scrollIntoView();
	};
	document.forms[0].onsubmit = async (e) => {
		e.preventDefault();
		const text = box.value.trim();
		if (!text) return;
		box.value = '';
		add('you', 'You', text);
		const r = await fetch('/chat', {
			method: 'POST',
			body: JSON.stringify({ sessionId: id, message: text }),
		});
		add('bot', 'Agent', (await r.json()).reply);
	};
</script>
